<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- theme tokens (15 curated palettes) ---------- */
:root{
  --bg:#f5eddc; --dots:rgba(35,26,46,.1); --surface:#fffaf0; --surface2:#efe4cf;
  --ink:#231a2e; --muted:#675a74; --edge:#231a2e; --mix:55%;
  --a1:#ff6b8a; --a2:#8f7bff; --a3:#25c2a0; --pop:#ffd24a;
  --font-head:'Bricolage Grotesque',sans-serif;
  --font-body:'Figtree',system-ui,sans-serif;
  --r-door:22px; --r-card:16px;
  --sh-door:5px 5px 0 var(--edge);
  --sh-door-h:8px 8px 0 var(--edge);
  --sh-row:3px 3px 0 var(--edge);
  --sh-row-h:5px 5px 0 var(--edge);
  --sh-btn:3px 3px 0 var(--edge);
  --sh-btn-h:5px 5px 0 var(--edge);
}

/* Light & Warm Themes */
[data-theme="sunny"]{--bg:#fff3c4;--dots:rgba(90,60,0,.12);--surface:#fffbea;--surface2:#f7e6a3;--ink:#2e2200;--muted:#7a6a30;--edge:#2e2200;--a1:#ff7a59;--a2:#7a6cff;--a3:#1fb89a;--pop:#ff9ec0}
[data-theme="mint"]{--bg:#e2f4e8;--dots:rgba(20,60,40,.11);--surface:#f6fff9;--surface2:#cfe9d7;--ink:#12301f;--muted:#4f6f60;--edge:#12301f;--a1:#ff7d6b;--a2:#3aa57a;--a3:#2e86de;--pop:#ffd24a}
[data-theme="lilac"]{--bg:#ebe5fb;--dots:rgba(50,30,100,.1);--surface:#faf7ff;--surface2:#dbd0f5;--ink:#241a45;--muted:#62588a;--edge:#241a45;--a1:#ff6fae;--a2:#7b61ff;--a3:#27c1b0;--pop:#ffd24a}
[data-theme="matcha"]{--bg:#e9eedc;--dots:rgba(43,58,36,.11);--surface:#f8faf2;--surface2:#dae3c6;--ink:#25331e;--muted:#5b6e52;--edge:#25331e;--a1:#d97757;--a2:#6b8f4e;--a3:#4da18c;--pop:#f2c94c}
[data-theme="rosewater"]{--bg:#fae8ec;--dots:rgba(74,28,42,.1);--surface:#fff7f9;--surface2:#f2d3dc;--ink:#3d1824;--muted:#7d4d5c;--edge:#3d1824;--a1:#e85d75;--a2:#a663cc;--a3:#38a3a5;--pop:#ffd166}
[data-theme="terracotta"]{--bg:#f2e2d5;--dots:rgba(68,36,24,.11);--surface:#fcf6f2;--surface2:#e5cbb8;--ink:#3b1f14;--muted:#785344;--edge:#3b1f14;--a1:#d95d39;--a2:#8c5e58;--a3:#4e8098;--pop:#f4a261}
[data-theme="honey"]{--bg:#faecc8;--dots:rgba(66,44,10,.11);--surface:#fffcf2;--surface2:#f0daa3;--ink:#362407;--muted:#785d2e;--edge:#362407;--a1:#e06d53;--a2:#9b5de5;--a3:#2a9d8f;--pop:#ffb703}
[data-theme="sakura"]{--bg:#fdebf2;--dots:rgba(72,26,48,.1);--surface:#fff9fc;--surface2:#f7d4e2;--ink:#3b1528;--muted:#7d4b64;--edge:#3b1528;--a1:#ff6b9d;--a2:#9b72cf;--a3:#4ecdc4;--pop:#ffe066}
[data-theme="slate"]{--bg:#e4ebf2;--dots:rgba(28,42,58,.11);--surface:#f7fafe;--surface2:#cfdbe8;--ink:#1b2838;--muted:#53667d;--edge:#1b2838;--a1:#e86f68;--a2:#5b7cfa;--a3:#2cb1bc;--pop:#ffd166}

/* Dark & Moody Themes */
[data-theme="night"]{--bg:#16111f;--dots:rgba(255,255,255,.07);--surface:#221b2e;--surface2:#2d2440;--ink:#f4eefb;--muted:#a99db8;--edge:#b9a9d6;--mix:30%;--a1:#ff8fa8;--a2:#a899ff;--a3:#4fe0c0;--pop:#ffd24a}
[data-theme="ocean"]{--bg:#0d1b2a;--dots:rgba(255,255,255,.06);--surface:#14283d;--surface2:#1d3752;--ink:#e8f3ff;--muted:#8fb0cc;--edge:#7fb4e6;--mix:30%;--a1:#ff9f7a;--a2:#6cb8ff;--a3:#5eead4;--pop:#ffd166}
[data-theme="plum"]{--bg:#1f0f26;--dots:rgba(255,255,255,.06);--surface:#2c1636;--surface2:#3a1d47;--ink:#fbeaf6;--muted:#c49ab8;--edge:#e9a6d0;--mix:30%;--a1:#ff7fb0;--a2:#c58bff;--a3:#ffc24a;--pop:#ffd24a}
[data-theme="espresso"]{--bg:#1c1411;--dots:rgba(255,235,215,.07);--surface:#291e1a;--surface2:#382a24;--ink:#f5ebe4;--muted:#b8a398;--edge:#d6b8a8;--mix:28%;--a1:#e88d67;--a2:#c996cc;--a3:#70c1b3;--pop:#f4b942}
[data-theme="forest"]{--bg:#111d18;--dots:rgba(220,255,235,.06);--surface:#192b23;--surface2:#233b30;--ink:#e6f5ed;--muted:#95b8a6;--edge:#8ec9ab;--mix:28%;--a1:#f28482;--a2:#84a59d;--a3:#f6bd60;--pop:#f6bd60}

[data-theme="night"] .danger,[data-theme="ocean"] .danger,[data-theme="plum"] .danger,[data-theme="espresso"] .danger,[data-theme="forest"] .danger{color:#ff8fa8}

/* ---------- look & feel overrides ---------- */
[data-font="editorial"]{
  --font-head:'Fraunces',Georgia,serif;
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
}
[data-font="mono"]{
  --font-head:'Space Mono',monospace;
  --font-body:'Figtree',system-ui,sans-serif;
}

[data-style="soft"]{
  --r-door:26px; --r-card:18px;
  --sh-door:0 8px 22px rgba(0,0,0,.08);
  --sh-door-h:0 12px 28px rgba(0,0,0,.13);
  --sh-row:0 4px 12px rgba(0,0,0,.06);
  --sh-row-h:0 7px 18px rgba(0,0,0,.1);
  --sh-btn:0 4px 10px rgba(0,0,0,.1);
  --sh-btn-h:0 6px 14px rgba(0,0,0,.15);
}

/* ---------- base & paper patterns ---------- */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  font-size:17px;
  color:var(--ink);
  min-height:100vh;
  line-height:1.5;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dots) 1.5px,transparent 1.5px);
  background-size:26px 26px;
  overflow-x:hidden;
  transition:background-color .25s ease, color .2s ease;
}
body[data-bg="grid"]{
  background-image:
    linear-gradient(to right, var(--dots) 1px, transparent 1px),
    linear-gradient(to bottom, var(--dots) 1px, transparent 1px);
  background-size:28px 28px;
}
body[data-bg="clean"]{
  background-image:none;
}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#app{max-width:960px;margin:0 auto;padding:22px 20px 90px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--a2);outline-offset:3px;border-radius:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:11px 14px;width:100%;outline:none;transition:box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:4px 4px 0 var(--a1)}
select option{color:#222}
svg{display:block}
h1,h2,.logo,.title-in,.modal h2{font-family:var(--font-head)}

/* ---------- top bar & navigation ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}
.logo{font-weight:800;font-size:1.55rem;text-decoration:none;letter-spacing:-.03em;display:inline-flex;align-items:baseline}
.logo span{display:inline-block;width:.36em;height:.36em;border-radius:50%;background:var(--a1);margin-left:3px}
.top-acts{display:flex;align-items:center;gap:6px}
.txtbtn{color:var(--muted);font-weight:600;padding:8px 14px;border-radius:99px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.txtbtn:hover{color:var(--ink);background:var(--surface2)}
.pillbtn{background:var(--surface);border:2px solid var(--edge);color:var(--ink);font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--edge);transition:.15s}
.pillbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--edge);background:var(--surface2)}
.trail{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 12px;border-radius:99px;background:var(--surface);border:2px solid var(--edge);text-decoration:none;font-weight:600;font-size:.92rem;transition:.15s}
.back:hover{transform:translateX(-3px)}
.crumbs{color:var(--muted);font-size:.92rem;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs i{font-style:normal;opacity:.5}

/* ---------- headings & editorial hero ---------- */
main.enter{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.eyebrow{font-size:.95rem;font-weight:600;color:var(--muted);margin-bottom:4px}
h1{font-weight:800;font-size:clamp(2.1rem,5.5vw,3.2rem);line-height:1.08;letter-spacing:-.03em}
.sub{color:var(--muted);margin-top:8px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.head-main{display:flex;align-items:center;gap:14px;min-width:0}
.head-art{flex:0 0 auto;color:var(--ink);opacity:.85;transition:transform .25s ease}
.head-art:hover{transform:rotate(-4deg) scale(1.05)}
.task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:4px}
.task-stamp{flex:0 0 auto;color:var(--ink);opacity:.72;margin-top:-4px}
.blk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.blk-head label{margin-bottom:0}
.mini-art{color:var(--ink);opacity:.65;display:inline-flex}

.banner-wrap{
  width:100%;height:145px;border-radius:var(--r-door);border:2px solid var(--edge);
  box-shadow:var(--sh-door);overflow:hidden;margin-bottom:24px;position:relative;background:var(--surface2);
}
.banner-wrap img{width:100%;height:100%;object-fit:cover;display:block}

.hello{margin:14px 0 32px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.hello-text{flex:1;min-width:0}
.doodle-hero{flex:0 0 auto;color:var(--ink);opacity:.88;transition:transform .25s ease}
.doodle-hero:hover{transform:rotate(-3deg) scale(1.03)}
@media(max-width:560px){
  .doodle-hero svg{width:76px;height:76px}
  .banner-wrap{height:115px}
}

/* ---------- buttons ---------- */
.primary{background:var(--pop);color:#231a2e;padding:11px 22px;border-radius:99px;font-weight:700;border:2px solid var(--edge);box-shadow:var(--sh-btn);transition:.12s;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.primary:hover{transform:translate(-1px,-1px);box-shadow:var(--sh-btn-h)}
.primary:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.ghost{padding:10px 20px;border-radius:99px;border:2px solid var(--edge);font-weight:600;transition:.15s;background:var(--surface);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.ghost:hover{background:var(--surface2)}
.danger{color:#c92a4a}
.sm{padding:7px 15px!important;font-size:.92rem}

/* ---------- doors ---------- */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.wrap{position:relative}
.door{
  display:flex;flex-direction:column;gap:6px;min-height:172px;padding:24px;border-radius:var(--r-door);
  text-decoration:none;color:var(--ink);text-align:left;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--c,var(--a2)) var(--mix),var(--surface));
  border:2px solid var(--edge);box-shadow:var(--sh-door);
  transition:transform .15s,box-shadow .15s;width:100%
}
.door:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-door-h)}
.door:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--edge)}
.door h2{font-weight:800;font-size:1.75rem;letter-spacing:-.02em;line-height:1.15;position:relative;z-index:1}
.door p{opacity:.82;position:relative;z-index:1}
.door .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:18px;font-weight:500;position:relative;z-index:1}
.door .go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.door-art{position:absolute;right:14px;top:14px;opacity:.22;pointer-events:none;color:var(--ink);transition:transform .25s ease,opacity .25s ease}
.door:hover .door-art{opacity:.36;transform:scale(1.08) rotate(4deg)}
.mono{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:1.4rem;color:#231a2e;margin-bottom:8px;background:var(--c);border:2px solid var(--edge)}
.bar{height:8px;border-radius:9px;background:rgba(127,127,127,.25);border:1.5px solid var(--edge);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .5s}
.door.add{border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center}
.door.add:hover{background:var(--surface);box-shadow:none;transform:none}

/* ---------- to-dos ---------- */
.addrow{display:flex;gap:10px;margin-bottom:20px}
.addrow input{padding:13px 20px;border-radius:99px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:2px solid var(--edge);border-radius:99px;flex-wrap:wrap}
.seg button{padding:7px 17px;border-radius:99px;font-weight:600;font-size:.93rem;color:var(--muted);transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.list{margin-top:24px}
.row{
  display:flex;align-items:center;gap:14px;padding:4px 10px 4px 14px;margin-bottom:14px;
  border-radius:var(--r-card);background:var(--surface);border:2px solid var(--edge);
  border-left:11px solid var(--c);box-shadow:var(--sh-row);transition:.15s
}
.row:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-row-h)}
.row.fade{opacity:.35}
.chk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);display:grid;place-items:center;color:transparent;transition:.15s}
.chk:hover{background:var(--c)}
.chk.on{background:var(--c);color:#231a2e}
.rowmain{flex:1;min-width:0;text-decoration:none;padding:10px 0}
.rowmain b{font-weight:600;font-size:1.05rem;display:block;overflow-wrap:anywhere}
.row.isdone .rowmain b{text-decoration:line-through;opacity:.5}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.pill{font-size:.78rem;font-weight:600;padding:1px 10px;border-radius:99px;border:1.5px solid var(--edge);background:var(--surface2);color:var(--ink);white-space:nowrap}
.p-doing,.p-drafting{background:#ffd27a;color:#231a2e}.p-waiting,.p-ongoing{background:#a9cbff;color:#231a2e}
.p-done,.p-complete{background:#9fe6c0;color:#231a2e}.p-idea{background:#e3d2ff;color:#231a2e}.p-revising{background:#ffbf8a;color:#231a2e}
.p-paused{background:#d9d2c6;color:#231a2e}
.d-over{background:#ff9aa8;color:#231a2e}.d-today{background:#ffbf8a;color:#231a2e}.d-soon{background:#ffe28a;color:#231a2e}
.rowgo{color:var(--muted);padding:0 8px}
.empty{color:var(--muted);padding:44px 12px;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.empty svg{opacity:.55}

/* ---------- task page ---------- */
.narrow{max-width:640px}
.title-in{font-weight:800;font-size:clamp(1.8rem,4.6vw,2.5rem);line-height:1.15;background:transparent;border:0;border-bottom:3px solid var(--edge);border-radius:0;padding:4px 0 12px;margin-bottom:30px;letter-spacing:-.03em}
.title-in:focus{box-shadow:none;border-bottom-color:var(--a1)}
.blk{margin-bottom:26px}
.blk>label{display:block;font-weight:700;margin-bottom:9px}
.two{display:grid;gap:10px}
.linkbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fileinfo{margin-top:12px;padding:12px 14px;border-radius:14px;border:2px dashed var(--edge);font-size:.95rem}
.fileinfo div{color:var(--muted);margin-top:4px}
details.more{margin-top:34px;border-top:2px solid var(--edge);padding-top:18px}
details.more summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'+ '}
details.more[open] summary::before{content:'\2013  '}
.bigdone{margin-top:34px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.bigdone .primary{padding:14px 32px;font-size:1.05rem}

/* ---------- library ---------- */
.sortrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{margin-bottom:0;flex:1 1 220px;max-width:380px}
.search input{border-radius:99px;padding:11px 20px}
.sortsel{width:auto;border-radius:99px;padding:10px 16px;font-weight:600}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.fc{padding:4px 13px;border-radius:99px;border:2px solid var(--edge);background:var(--surface);font-weight:600;font-size:.88rem}
.fc.on{background:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.tile{
  display:flex;flex-direction:column;gap:9px;height:100%;min-height:150px;padding:18px;
  border-radius:var(--r-door);text-decoration:none;color:var(--ink);
  background:color-mix(in srgb,var(--c) var(--mix),var(--surface));
  border:2px solid var(--edge);box-shadow:var(--sh-row);transition:.15s
}
a.tile:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-door)}
a.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.trow{display:flex;justify-content:flex-start;align-items:center;flex-wrap:wrap;gap:8px;min-height:30px}
.kind{font-weight:600;font-size:.85rem;opacity:.8}
.pinned{display:inline-flex}
.tile b{font-weight:700;font-size:1.12rem;line-height:1.25;overflow-wrap:anywhere}
.sum{font-size:.95rem;opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;font-weight:600;padding:0 8px;border-radius:7px;border:1.5px solid var(--edge)}
.tfoot{margin-top:auto;padding-top:6px;font-size:.84rem;opacity:.8}
.quick{margin-top:38px}
.qrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.qchip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:99px;
  max-width:270px;text-decoration:none;font-weight:600;
  background:color-mix(in srgb,var(--c) var(--mix),var(--surface));
  border:2px solid var(--edge);transition:.15s
}
.qchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--edge)}

/* ---------- quiet tools & menus ---------- */
.tools{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.wrap:hover .tools,.wrap:focus-within .tools{opacity:1}
@media(hover:none){.tools{opacity:.75}}
.ib{width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--ink);border:2px solid var(--edge);display:grid;place-items:center}
.ib:hover{background:var(--pop);color:#231a2e}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--edge);display:grid;place-items:center;transition:.15s}
.iconbtn:hover{background:var(--surface2)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;background:var(--surface);border:2px solid var(--edge);border-radius:16px;box-shadow:5px 5px 0 var(--edge);padding:6px;z-index:20}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600}
.menu button:hover{background:var(--surface2)}

/* ---------- steps & timer ---------- */
.cnt{font-weight:600;color:var(--muted);margin-left:6px}
.step{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1.5px dashed rgba(127,127,127,.4)}
.chk.sm{width:24px;height:24px}
.step.on span{text-decoration:line-through;opacity:.5}
.stepx{margin-left:auto;opacity:.45;padding:4px}

.tpill{position:fixed;left:18px;bottom:18px;z-index:90;display:flex;gap:12px;align-items:center;padding:9px 10px 9px 18px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:4px 4px 0 var(--a1)}

/* ---------- modal & tactile theme cards ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,12,30,.55);display:grid;place-items:center;padding:16px;animation:fade .15s}

.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:2px solid var(--edge);border-radius:24px;padding:26px;box-shadow:8px 8px 0 var(--edge);animation:rise .25s both}
.modal.wide{width:min(620px,100%)}
.modal h2{font-weight:800;font-size:1.7rem;margin-bottom:18px;letter-spacing:-.02em}
.fld{margin-bottom:18px}
.fld label{display:block;font-weight:700;margin-bottom:8px}
.fld small{display:block;color:var(--muted);margin-top:6px;font-size:.86rem}
.mrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.mrow .sp{flex:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);border:2px solid var(--edge);transition:.12s}

/* ---------- stickers & rewards ---------- */
.sticker{
  --sz:44px;

}

.sticker.sm{--sz:34px}
.sticker.md{--sz:44px}
.sticker.lg{--sz:64px}

.winchip{
  display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:99px;

}

/* sticker book */
.sb-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.sb-stat{padding:14px 16px;border:2px solid var(--edge);border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-row)}

a.earned:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-row-h)}

@media(max-width:560px){

}

.banner-presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

}

@media(max-width:480px){

  .top-acts .pillbtn .lb{display:none}
}

<body>
<div id="app"></div>
<script>
/* ---------- data & persistence ---------- */
const KEY='inkwell-hub-v2';
const uid=()=>Math.random().toString(36).slice(2,10);
const COLORS=['#ff7a9c','#8b6cff','#2dd4bf','#ffb45e','#4aa8ff','#c084fc','#7ddc6f','#ff8a5b'];
const STATUS={todo:'To do',doing:'In progress',waiting:'Waiting',done:'Done'};
const ORDER=['todo','doing','waiting','done'];
const defCats=()=>['Threads','Character development','OOG writing'].map(name=>({id:uid(),name}));

const DEFAULT_LOOK={
  doodles:'inkwell', // 'inkwell' | 'botanical' | 'celestial' | 'none'
  bg:'dots',         // 'dots' | 'grid' | 'clean'
  font:'grotesk',    // 'grotesk' | 'editorial' | 'mono'
  style:'brutal',    // 'brutal' | 'soft'
  banner:''          // '' | preset key | custom URL
};

const DEFAULT_PREFS={
  greeting:'time',   // 'time' | 'cozy' | 'minimal'
  timer:25,          // 15 | 25 | 45
  cleanup:'keep'     // 'keep' | '7days'
};

function seed(){
  const s={id:uid(),name:'Ellipsus',color:COLORS[1],cats:defCats()};
  const t=(ci,text,status,extra={})=>({id:uid(),siteId:s.id,catId:s.cats[ci].id,text,status,due:'',url:'',libId:'',note:'',doneAt:0,...extra});
  const f1=uid(),f2=uid();
  return{
    theme:'paper',
    name:'',
    look:{...DEFAULT_LOOK},
    prefs:{...DEFAULT_PREFS},
    stickers:{custom:[],earned:[]},
    sites:[s],
    tasks:[
      t(0,'Example: reply to the rooftop scene','todo',{note:'Edit or delete me.'}),
      t(1,'Example: write a backstory','todo'),
      t(2,'Example: finish chapter three','doing',{due:new Date(Date.now()+2*864e5).toISOString().slice(0,10)})
    ],
    lib:[
      {id:f1,parent:'',type:'folder',name:'Main stories',url:'',note:'Example folder. Edit or delete me.',status:'ongoing',tags:'main',pin:true},
      {id:uid(),parent:f1,type:'file',name:'Chapter one',url:'https://ellipsus.com',note:'Opening scene, needs a stronger last line.',status:'drafting',tags:'arc one, main',words:'3200',worked:new Date().toISOString().slice(0,10)},
      {id:uid(),parent:f1,type:'file',name:'Plot timeline',url:'https://docs.google.com/spreadsheets',note:'Who is where, and when.',status:'ongoing',tags:'planning'},
      {id:uid(),parent:f1,type:'file',name:'Mood board',url:'https://pinterest.com',note:'',status:'',tags:'visuals'},
      {id:f2,parent:'',type:'folder',name:'Characters',url:'',note:''}
    ]
  };
}

function load(){
  try{
    const a=JSON.parse(localStorage.getItem(KEY));
    if(a&&a.sites){
      a.look={...DEFAULT_LOOK,...(a.look||{})};
      a.prefs={...DEFAULT_PREFS,...(a.prefs||{})};
      return a;
    }
  }catch(e){}
  try{
    const o=JSON.parse(localStorage.getItem('inkwell-hub-v1'));
    if(o&&o.sites){
      o.theme=({sunrise:'dawn'})[o.ui&&o.ui.theme]||(o.ui&&o.ui.theme)||'midnight';
      o.look={...DEFAULT_LOOK};
      o.prefs={...DEFAULT_PREFS};
      delete o.ui;delete o.log;
      return o;
    }
  }catch(e){}
  return seed();
}

function normalizeStickers(st){
  st=st&&typeof st==='object'?st:{};
  return{
    custom:Array.isArray(st.custom)?st.custom.filter(x=>x&&x.id&&x.src):[],
    earned:Array.isArray(st.earned)?st.earned.filter(x=>x&&x.sticker).map(x=>({...x,id:x.id||uid(),at:x.at||Date.now()})):[]
  };
}
let S=load();
S.recent=S.recent||[];
S.look={...DEFAULT_LOOK,...(S.look||{})};
S.prefs={...DEFAULT_PREFS,...(S.prefs||{})};
S.stickers=normalizeStickers(S.stickers);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}};

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fixUrl=u=>{u=(u||'').trim();return!u?'':/^[a-z][a-z0-9+.-]*:/i.test(u)?u:'https://'+u};
const site=id=>S.sites.find(s=>s.id===id);
const libItem=id=>S.lib.find(l=>l.id===id);
const hostOf=u=>{try{return new URL(fixUrl(u)).hostname.replace('www.','')}catch(e){return u}};
const hash=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0);
const colorFor=l=>COLORS[hash(l.id)%COLORS.length];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-today())/864e5);
const fmt=s=>new Date(s+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

function dueInfo(t){
  if(!t.due)return null;
  if(t.status==='done')return{cls:'',txt:fmt(t.due)};
  const d=daysTo(t.due);
  if(d<0)return{cls:'d-over',txt:plural(-d,'day')+' overdue'};
  if(d===0)return{cls:'d-today',txt:'Due today'};
  if(d===1)return{cls:'d-soon',txt:'Due tomorrow'};
  if(d<=3)return{cls:'d-soon',txt:'Due in '+d+' days'};
  return{cls:'',txt:'Due '+fmt(t.due)};
}
const isOpen=t=>t.status!=='done';
const isSoon=t=>isOpen(t)&&t.due&&daysTo(t.due)<=3;

/* ---------- icons & editorial SVG illustrations ---------- */
const IC={
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  ext:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>'
};
const mk=(d,n=14,f='none')=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const STAR='<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/>';
Object.assign(IC,{
  pencil:mk('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  star:mk(STAR),
  starOn:mk(STAR,14,'currentColor'),
  x:mk('<path d="M6 6l12 12M18 6L6 18"/>',14),
  plus:mk('<path d="M12 5v14M5 12h14"/>',15),
  palette:mk('<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16c3.3 0 6-2.7 6-6 0-4.9-4.5-8.6-10-8.6z"/>',16)
});

/* Editorial Doodles (3 distinct sets: inkwell, botanical, celestial) */
const DOODLES={
  inkwell:{
    homeHero:`<svg width="96" height="96" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 74h36l5 22c1 4-2 8-6 8H43c-4 0-7-4-6-8l5-22z" fill="var(--surface)"/>
      <rect x="47" y="64" width="26" height="10" rx="3" fill="var(--a2)"/>
      <path d="M62 64C68 44 82 26 98 16c-3 18-13 33-28 42l-8 6z" fill="var(--pop)"/>
      <path d="M60 66L92 22"/>
      <path d="M24 38l3-7 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="var(--a1)" stroke="none"/>
      <circle cx="94" cy="78" r="3.5" fill="var(--a3)" stroke="none"/>
    </svg>`,
    homeDoor1:`<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

const STICKERS=STICKER_SETS.flatMap(set=>set.items.map(([emoji,name],i)=>({id:set.id+'-'+(i+1),emoji,name,set:set.name,setId:set.id})));
const STICKER_BY_ID=Object.fromEntries(STICKERS.map(s=>[s.id,s]));

const customSticker=id=>S.stickers.custom.find(c=>c.id===id)||null;
const stickerRef=ref=>ref&&(ref.kind==='builtin'||ref.kind==='custom')&&ref.id?ref:null;
function resolveSticker(ref){
  if(!ref)return null;
  if(ref.kind==='custom'){
    const c=customSticker(ref.id);
    return c?{kind:'custom',id:c.id,name:c.name||'My sticker',src:c.src,emoji:'🖼️'}:{kind:'custom',id:ref.id,name:'Removed picture',src:'',emoji:'🖼️'};
  }
  const b=STICKER_BY_ID[ref.id];
  return b?{kind:'builtin',id:b.id,name:b.name,set:b.set,emoji:b.emoji}:null;
}
function stickerHtml(ref,size='md',extra=''){
  const st=resolveSticker(ref);if(!st)return'';
  const rot=(hash(st.id||st.name)%9)-4;
  return`<span class="sticker ${size}" style="--rot:${rot}deg;${extra}" role="img" aria-label="${esc(st.name)}" title="${esc(st.name)}">${st.src?`<img src="${esc(st.src)}" alt="">`:`<span class="sticker-emoji">${st.emoji}</span>`}</span>`;
}
function ownedStickerIds(){
  const own=new Set();
  S.stickers.earned.forEach(e=>{if(e.sticker&&e.sticker.kind==='builtin')own.add(e.sticker.id)});
  S.tasks.forEach(t=>{if(t.sticker&&t.sticker.kind==='builtin')own.add(t.sticker.id)});
  return own;
}
const stDate=at=>{const d=new Date(Number(at)||Date.now());return isNaN(d.getTime())?fmt(todayStr()):d.toLocaleDateString(undefined,{day:'numeric',month:'short'})};

function lastEarnedFor(taskId){
  for(let i=S.stickers.earned.length-1;i>=0;i--)if(S.stickers.earned[i].taskId===taskId)return S.stickers.earned[i];
  return null;
}
function pickSticker(){
  const own=ownedStickerIds();
  const fresh=STICKERS.filter(s=>!own.has(s.id));
  let pool=fresh.length?fresh:STICKERS;
  const last=S.stickers.earned[S.stickers.earned.length-1];
  if(last&&last.sticker&&last.sticker.kind==='builtin'){
    const diff=pool.filter(s=>s.id!==last.sticker.id);
    if(diff.length)pool=diff;
  }
  const pick=pool[Math.floor(Math.random()*pool.length)];
  return{kind:'builtin',id:pick.id};
}
function awardSticker(t,ref){
  const st=stickerRef(ref)||pickSticker();
  const s=site(t.siteId),c=s&&s.cats.find(x=>x.id===t.catId),at=Date.now();
  t.sticker=st;t.stickerAt=at;
  S.stickers.earned.push({id:uid(),taskId:t.id,text:t.text||'Untitled',sticker:st,siteId:t.siteId,catId:t.catId,siteName:s?s.name:'',catName:c?c.name:'',at});
  save();
  return st;
}
function setTaskSticker(t,ref){
  const st=stickerRef(ref);if(!t||!st)return;
  const rec=lastEarnedFor(t.id);
  t.sticker=st;
  if(rec){rec.sticker=st;t.stickerAt=rec.at||Date.now()}
  else{t.stickerAt=Date.now();awardSticker(t,st);return}
  save();
}
function syncEarnedStickers(){
  let changed=false;
  S.tasks.forEach(t=>{
    if(t.status!=='done')return;
    const rec=lastEarnedFor(t.id);
    if(!t.sticker&&rec){t.sticker=rec.sticker;t.stickerAt=t.stickerAt||rec.at;changed=true}
    else if(t.sticker&&!rec){
      const st=stickerRef(t.sticker);
      if(!st)return;
      const s=site(t.siteId),c=s&&s.cats.find(x=>x.id===t.catId);
      t.stickerAt=t.stickerAt||t.doneAt||Date.now();
      S.stickers.earned.push({id:uid(),taskId:t.id,text:t.text||'Untitled',sticker:st,siteId:t.siteId,catId:t.catId,siteName:s?s.name:'',catName:c?c.name:'',at:t.stickerAt});
      changed=true;
    }
  });
  if(changed)save();
}
function showReward(ref,sub){
  const st=resolveSticker(ref);if(!st)return;
  document.querySelectorAll('.reward-pop').forEach(n=>n.remove());
  const el=document.createElement('div');el.className='reward-pop';el.setAttribute('role','status');
  el.innerHTML=`${stickerHtml(ref,'md')}<div><b>Sticker earned!</b><small>${esc(st.name)}${sub?' · '+esc(sub):''}</small></div>`;
  el.onclick=()=>{el.remove();location.hash='#/stickers'};
  document.body.appendChild(el);
  setTimeout(()=>{if(!el.isConnected)return;el.classList.add('out');setTimeout(()=>el.remove(),300)},3200);
}
function openStickerUpload(after){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){toast('That is not an image.');inp.remove();return}
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=240,scale=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        let src='';try{src=cv.toDataURL('image/webp',.86)}catch(e){src=''}
        if(src.indexOf('data:image/webp')!==0)src=cv.toDataURL('image/png');
        const rec={id:uid(),name:(f.name.replace(/\.[^.]+$/,'')||'My sticker').slice(0,24),src,at:Date.now()};
        S.stickers.custom.push(rec);
        if(!save()){S.stickers.custom=S.stickers.custom.filter(x=>x.id!==rec.id);inp.remove();toast('That image is too big to save.');return}
        if(after)after({kind:'custom',id:rec.id});else render();
        inp.remove();
        toast('Sticker added');
      };
      img.onerror=()=>{inp.remove();toast('That image could not be read.')};
      img.src=fr.result;
    };
    fr.onerror=()=>{inp.remove();toast('That image could not be read.')};
    fr.readAsDataURL(f);
  };
  inp.click();
}
function backfillStickers(){
  const missing=S.tasks.filter(t=>t.status==='done'&&!resolveSticker(t.sticker));
  if(!missing.length){toast('Every finished to-do has a sticker');return}
  let last=null;
  missing.forEach(t=>{last=awardSticker(t)});
  render();
  if(last)showReward(last,plural(missing.length,'to-do')+' caught up');
}
function rewardStrip(){
  const earned=S.stickers.earned;

const KINDS={doc:['Doc','#8f7bff'],sheet:['Sheet','#25c2a0'],slides:['Slides','#ffb45e'],pdf:['PDF','#ff6b6b'],image:['Image','#4aa8ff'],video:['Video','#ff6b8a'],audio:['Audio','#c084fc'],board:['Board','#7ddc6f'],chat:['Thread','#ff8a5b'],web:['Web page','#6ec1e4'],note:['Note','#ffd24a'],drive:['Cloud folder','#4fd1a5'],other:['Link','#b5a8c9']};

function detectKind(u){
  u=(u||'').toLowerCase();if(!u)return'';
  const t=[
    [/docs\.google\.com\/spreadsheets|\.xlsx?(\?|$)|\.csv(\?|$)|airtable\.com/,'sheet'],
    [/docs\.google\.com\/presentation|\.pptx?(\?|$)|slides\.com/,'slides'],
    [/docs\.google\.com|\.docx?(\?|$)|ellipsus\.com/,'doc'],
    [/\.pdf(\?|$)/,'pdf'],
    [/\.(png|jpe?g|gif|webp|svg)(\?|$)|imgur\.com|flickr\.com/,'image'],
    [/youtube\.com|youtu\.be|vimeo\.com|twitch\.tv/,'video'],
    [/spotify\.com|soundcloud\.com|music\.apple\.com/,'audio'],
    [/pinterest\.|figma\.com|miro\.com|canva\.com|trello\.com/,'board'],
    [/discord\.com|tumblr\.com|reddit\.com|twitter\.com|\/\/(www\.)?x\.com|bsky\.app|threads\.net/,'chat'],
    [/notion\.so|notion\.site|evernote\.com/,'note'],
    [/drive\.google\.com|dropbox\.com|onedrive|sharepoint\.com|mega\.nz/,'drive']
  ];
  for(const[r,k]of t)if(r.test(u))return k;
  return'web';
}
const kindOf=l=>{
  if(l.type==='folder')return'folder';
  if(KINDS[l.kind])return l.kind;
  const d=detectKind(l.url);
  return KINDS[d]?d:'doc';
};
const kindColor=l=>l.type==='folder'?colorFor(l):KINDS[kindOf(l)][1];
const kindName=l=>l.type==='folder'?'Folder':KINDS[kindOf(l)][0];

function toast(m){
  document.querySelectorAll('.toast').forEach(n=>n.remove());
  const e=document.createElement('div');e.className='toast';e.textContent=m;
  document.body.appendChild(e);setTimeout(()=>e.remove(),2000);
}
function burst(x,y,color){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cols=[color,color,'#ffd978','#fff'];
  for(let i=0;i<14;i++){
    const p=document.createElement('div');p.className='dot';p.style.background=cols[i%cols.length];p.style.left=x+'px';p.style.top=y+'px';
    document.body.appendChild(p);
    const a=(i/14)*Math.PI*2,v=50+Math.random()*50;
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v}px) scale(.2)`,opacity:0}],
      {duration:650,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}

  applyLook();

    const f=r[1]?libItem(r[1]):null;
    if(!r[1]||(f&&f.type==='folder'))page=libPage(f);

function greet(){
  const mode=(S.prefs&&S.prefs.greeting)||'time';
  const nm=S.name?', '+esc(S.name):'';
  if(mode==='minimal')return S.name?esc(S.name)+'.':'Your desk.';
  if(mode==='cozy'){
    const h=new Date().getHours();
    const lines=h<12?['Fresh page today','Ready to write','Coffee & chapters']:h<18?['Keep the ink flowing','One scene at a time','Welcome back']:['Quiet night writing','Cozy desk hours','Stories after dark'];
    const pick=lines[new Date().getDate()%lines.length];
    return pick+nm+'.';
  }
  const h=new Date().getHours();
  const base=h<5?'Late night':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  return base+nm+'.';
}

function ancestry(id){const p=[],seen=new Set();let cur=id;while(cur&&!seen.has(cur)){seen.add(cur);const it=libItem(cur);if(!it)break;p.unshift(it);cur=it.parent}return p}
const LST={idea:'Idea',drafting:'Drafting',revising:'Revising',ongoing:'Ongoing',paused:'On hold',complete:'Complete'};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ago=d=>{if(!d)return'';const n=-daysTo(d);return n<=0?'today':n===1?'yesterday':n<30?n+' days ago':fmt(d)};

function libResults(f){
  const cur=f?f.id:'',s=q.trim().toLowerCase();
  const base=s?S.lib.filter(l=>(l.name+' '+l.note+' '+l.url+' '+(l.tags||'')+' '+(LST[l.status]||'')+' '+kindName(l)).toLowerCase().includes(s)):S.lib.filter(l=>l.parent===cur);
  const kinds=[...new Set(base.filter(l=>l.type==='file').map(kindOf))];
  const stR=k=>k?Object.keys(LST).indexOf(k):99;
  const items=(lkind?base.filter(l=>kindOf(l)===lkind):base).slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(a.type===b.type?0:a.type==='folder'?-1:1)||(lsort==='worked'?(b.worked||'').localeCompare(a.worked||''):lsort==='status'?stR(a.status)-stR(b.status):0)||a.name.localeCompare(b.name));
  const chips=base.length>=6&&kinds.length>=2?`<div class="fchips"><button class="fc ${lkind?'':'on'}" data-act="lkind" data-v="">All</button>${kinds.map(k=>`<button class="fc ${lkind===k?'on':''}" data-act="lkind" data-v="${k}">${KINDS[k][0]}</button>`).join('')}</div>`:'';
  const emptyArt=getDoodle('empty');
  if(!items.length)return chips+`<div class="empty">${emptyArt}<span>${s?'Nothing matches.':'Empty here.'}</span></div>`;
  return chips+`<div class="tiles">${items.map(l=>{
    const k=kindOf(l),kids=S.lib.filter(x=>x.parent===l.id).length;
    const lk=S.tasks.filter(t=>t.libId===l.id&&isOpen(t)).length;
    const tags=(l.tags||'').split(',').map(x=>x.trim()).filter(Boolean);
    const bits=[];
    if(s)bits.push(ancestry(l.parent).map(p=>p.name).join(' / ')||'Top level');
    if(l.type==='folder')bits.push(plural(kids,'item'));
    if(l.words)bits.push(Number(l.words).toLocaleString()+' words');
    if(l.worked)bits.push('Worked on '+ago(l.worked));
    if(lk)bits.push(plural(lk,'open to-do'));
    if(l.type==='file')bits.push(l.url?hostOf(l.url):'No link yet');
    const inner=`<div class="trow">${svg(k,26)}<span class="kind">${esc(kindName(l))}</span>${l.pin?`<span class="pinned">${IC.starOn}</span>`:''}${l.status?`<span class="pill p-${l.status}">${LST[l.status]}</span>`:''}</div>
      <b>${esc(l.name)}</b>${l.note?`<div class="sum">${esc(l.note)}</div>`:''}
      ${tags.length?`<div class="chips">${tags.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
      <div class="tfoot">${bits.map(esc).join(' &middot; ')}</div>`;
    const st=`style="--c:${kindColor(l)}" data-lib="${l.id}"`;
    const tile=l.type==='folder'?`<a class="tile" href="#/lib/${l.id}" ${st}>${inner}</a>`
      :l.url?`<a class="tile" href="${esc(fixUrl(l.url))}" target="_blank" rel="noopener" ${st}>${inner}</a>`
      :`<div class="tile" style="--c:${kindColor(l)}">${inner}</div>`;
    return`<div class="wrap">${tile}<div class="tools"><button class="ib" data-act="pin" data-id="${l.id}" title="${l.pin?'Unpin':'Pin'}">${l.pin?IC.starOn:IC.star}</button><button class="ib" data-act="editlib" data-id="${l.id}" title="Edit">${IC.pencil}</button></div></div>`}).join('')}</div>`;
}

/* ---------- modals & forms ---------- */
function modal({title,fields,onSave,onDelete}){
  const ov=document.createElement('div');ov.className='ov';
  const fh=fields.map(f=>{
    let inp;
    if(f.type==='select')inp=`<select name="${f.key}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea name="${f.key}" rows="${f.rows||3}">${esc(f.value)}</textarea>`;
    else if(f.type==='swatch')inp=`<input type="hidden" name="${f.key}" value="${esc(f.value)}"><div class="swatches">${COLORS.map(c=>`<button type="button" class="sw ${c===f.value?'on':''}" style="--c:${c}" data-c="${c}" aria-label="Colour"></button>`).join('')}</div>`;
    else inp=`<input name="${f.key}" type="${f.type==='date'||f.type==='number'?f.type:'text'}" value="${esc(f.value)}" placeholder="${esc(f.ph||'')}" autocomplete="off">`;
    return`<div class="fld"><label>${f.label}</label>${inp}${f.hint?`<small>${f.hint}</small>`:''}</div>`}).join('');
  ov.innerHTML=`<form class="modal"><h2>${title}</h2>${fh}<div class="mrow">${onDelete?'<button type="button" class="ghost danger" data-d>Delete</button>':''}<span class="sp"></span><button type="button" class="ghost" data-x>Cancel</button><button class="primary">Save</button></div></form>`;
  document.body.appendChild(ov);
  const form=ov.querySelector('form');
  const onKey=e=>{if(e.key==='Escape')close()};
  const close=()=>{ov.remove();document.removeEventListener('keydown',onKey)};
  document.addEventListener('keydown',onKey);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  form.querySelector('[data-x]').onclick=close;
  form.addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;
    b.closest('.fld').querySelector('input[type=hidden]').value=b.dataset.c;
    b.parentElement.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))});
  const d=form.querySelector('[data-d]');
  if(d)d.onclick=()=>{
    askConfirm('This item will be permanently removed.','Delete',()=>{onDelete();close();render()});
  };
  form.onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>v[f.key]=form.elements[f.key].value);onSave(v);close();render()};
  const first=form.querySelector('input:not([type=hidden]),textarea');if(first)first.focus();
}

function libOptions(){
  const out=[['','Nothing linked']],seen=new Set();
  const walk=(p,d)=>S.lib.filter(l=>l.parent===p).forEach(l=>{
    if(seen.has(l.id))return;seen.add(l.id);
    out.push([l.id,' '.repeat(d)+(l.type==='folder'?'Folder: ':'')+l.name]);walk(l.id,d+1)
  });
  walk('',0);return out;
}
function folderOptions(excl){
  const bad=new Set();const mark=id=>{if(bad.has(id))return;bad.add(id);S.lib.filter(l=>l.parent===id).forEach(l=>mark(l.id))};if(excl)mark(excl);
  const out=[['','Top level']],seen=new Set();
  const walk=(p,d)=>S.lib.filter(l=>l.parent===p&&l.type==='folder'&&!bad.has(l.id)).forEach(l=>{
    if(seen.has(l.id))return;seen.add(l.id);
    out.push([l.id,' '.repeat(d)+l.name]);walk(l.id,d+1)
  });
  walk('',0);return out;
}

function siteForm(s){
  const isNew=!s;
  s=s||{id:uid(),name:'',color:COLORS[S.sites.length%COLORS.length],cats:defCats()};
  modal({title:isNew?'Add a site':'Edit site',
    fields:[
      {key:'name',label:'Name',value:s.name,ph:'Jcink, Tumblr, other RP sites'},
      {key:'color',label:'Colour',type:'swatch',value:s.color},
      {key:'cats',label:'Sections',type:'textarea',rows:5,value:s.cats.map(c=>c.name).join('\n'),hint:'One per line, rename freely. If you remove a line, its to-dos move to the first section.'}],
    onSave:v=>{
      const old=s.cats.slice(),used=new Set(),lines=v.cats.split('\n').map(x=>x.trim()).filter(Boolean);
      const next=lines.map((name,i)=>{
        let hit=old.find(o=>!used.has(o.id)&&o.name===name);
        if(!hit){const o=old[i];if(o&&!used.has(o.id)&&!lines.includes(o.name))hit=o}
        if(hit){used.add(hit.id);hit.name=name;return hit}
        return{id:uid(),name}});
      s.name=v.name.trim()||'Untitled';s.color=v.color;s.cats=next.length?next:[{id:uid(),name:'To-dos'}];
      S.tasks.forEach(t=>{if(t.siteId===s.id&&!s.cats.some(c=>c.id===t.catId))t.catId=s.cats[0].id});
      if(isNew)S.sites.push(s)},
    onDelete:isNew?null:()=>{S.tasks=S.tasks.filter(t=>t.siteId!==s.id);S.sites=S.sites.filter(x=>x.id!==s.id);location.hash='#/quests'}});
}

      ...(l.type==='file'?[{key:'kind',label:'Type',type:'select',value:l.kind||'',options:[['','Auto from link'],...Object.entries(KINDS).map(([k,v])=>[k,v[0]])]}]:[]),
      {key:'status',label:'Status',type:'select',value:l.status||'',options:[['','No status'],...Object.entries(LST)]},

const nameFromUrl=u=>{try{const x=new URL(fixUrl(u));const seg=decodeURIComponent(x.pathname.split('/').filter(Boolean).pop()||'');return seg&&!/^[\w-]{20,}$/.test(seg)?seg.replace(/[-_]/g,' '):x.hostname.replace('www.','')}catch(e){return u}};
function bulkForm(){

    fields:[{key:'txt',label:'Links',type:'textarea',rows:9,value:'',hint:'One per line. Either just a link, or Name | link.'}],
    onSave:v=>{v.txt.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{
      let name='',url='';
      if(line.includes('|')){const i=line.indexOf('|');name=line.slice(0,i).trim();url=line.slice(i+1).trim()}
      else if(/^(https?:\/\/|www\.)\S+$/i.test(line)){url=line;name=nameFromUrl(line)}
      else name=line;
      S.lib.push({id:uid(),parent,type:'file',kind:'',name:name||nameFromUrl(url),url,note:'',status:'',tags:'',words:'',worked:'',pin:false})})}});
}

/* ---------- Look & Feel Customizer Modal ---------- */

  const lk=S.look;
  const doodleOpts=[['inkwell','Inkwell & Quill'],['botanical','Botanical'],['celestial','Celestial'],['none','None']];
  const bgOpts=[['dots','Polka dots'],['grid','Graph grid'],['clean','Clean paper']];
  const fontOpts=[['grotesk','Playful Grotesk'],['editorial','Editorial Serif'],['mono','Cozy Mono']];
  const styleOpts=[['brutal','Tactile Crisp'],['soft','Soft Rounded']];

  ov.innerHTML=`<div class="modal wide">
    <h2>Look &amp; feel</h2>
    <div class="fld">
      <label>Theme (${THEMES.length} palettes)</label>
      <div id="th-wrap">${themeGridHtml(cur)}</div>
    </div>
    <div class="fld">
      <label>Doodles</label>
      <div class="opt-grid" data-lk="doodles">
        ${doodleOpts.map(([k,l])=>`<button type="button" class="opt-btn ${lk.doodles===k?'on':''}" data-v="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Home banner</label>
      <input id="banner-in" value="${esc(BANNER_PRESETS[lk.banner]?'':lk.banner)}" placeholder="Paste an image URL, or pick a preset below" autocomplete="off">
      <div class="banner-presets">
        <button type="button" class="bpre ${!lk.banner?'on':''}" data-bp="">Off</button>
        ${Object.entries(BANNER_PRESETS).map(([k,v])=>`<button type="button" class="bpre ${lk.banner===k?'on':''}" data-bp="${k}">${v.label}</button>`).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Typography</label>
      <div class="opt-grid" data-lk="font">
        ${fontOpts.map(([k,l])=>`<button type="button" class="opt-btn ${lk.font===k?'on':''}" data-v="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Paper texture &amp; cards</label>
      <div class="opt-grid" data-lk="bg" style="margin-bottom:8px">
        ${bgOpts.map(([k,l])=>`<button type="button" class="opt-btn ${lk.bg===k?'on':''}" data-v="${k}">${l}</button>`).join('')}
      </div>
      <div class="opt-grid" data-lk="style">
        ${styleOpts.map(([k,l])=>`<button type="button" class="opt-btn ${lk.style===k?'on':''}" data-v="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="mrow">
      <span class="sp"></span>
      <button type="button" class="primary" data-x>Done</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  const onKey=e=>{if(e.key==='Escape')close()};
  const close=()=>{ov.remove();document.removeEventListener('keydown',onKey)};
  document.addEventListener('keydown',onKey);
  ov.onmousedown=e=>{if(e.target===ov)close()};
  ov.querySelector('[data-x]').onclick=close;

  const bindThemes=()=>{
    ov.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{
      S.theme=b.dataset.th;
      render();
      ov.querySelector('#th-wrap').innerHTML=themeGridHtml(S.theme);
      bindThemes();
    });
  };
  bindThemes();

  ov.querySelectorAll('[data-lk]').forEach(grp=>{
    const key=grp.dataset.lk;
    grp.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.onclick=()=>{
        S.look[key]=btn.dataset.v;
        grp.querySelectorAll('.opt-btn').forEach(x=>x.classList.toggle('on',x===btn));

      };

    ov.querySelectorAll('.bpre').forEach(b=>b.classList.toggle('on',b.dataset.bp===(S.look.banner||'')));
  };
  bannerIn.oninput=()=>{
    S.look.banner=bannerIn.value.trim();
    syncBannerBtns();
    render();
  };
  ov.querySelectorAll('.bpre').forEach(btn=>{
    btn.onclick=()=>{
      S.look.banner=btn.dataset.bp;
      bannerIn.value='';

      render();
    };
  });
}

/* ---------- Settings Modal (Clean & Practical, No Theme Picker) ---------- */
function settings(){
  const ov=document.createElement('div');ov.className='ov';
  const pr={...DEFAULT_PREFS,...(S.prefs||{})};
  const doneCount=S.tasks.filter(t=>t.status==='done').length;
  const greetOpts=[['time','Time of day'],['cozy','Cozy nudges'],['minimal','Minimal']];
  const timerOpts=[[15,'15 min'],[25,'25 min'],[45,'45 min']];
  const cleanOpts=[['keep','Keep in Done tab'],['7days','Auto-clear after 7 days']];

  ov.innerHTML=`<div class="modal"><h2>Settings</h2>
    <div class="fld">
      <label>Your name</label>
      <input id="nm" value="${esc(S.name||'')}" placeholder="Shows in the home greeting" autocomplete="off">
    </div>
    <div class="fld">
      <label>Greeting style</label>
      <div class="opt-grid" data-pref="greeting">
        ${greetOpts.map(([k,l])=>`<button type="button" class="opt-btn ${pr.greeting===k?'on':''}" data-v="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Default focus timer</label>
      <div class="opt-grid" data-pref="timer">
        ${timerOpts.map(([k,l])=>`<button type="button" class="opt-btn ${Number(pr.timer)===k?'on':''}" data-v="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Completed to-dos</label>
      <div class="opt-grid" data-pref="cleanup">
        ${cleanOpts.map(([k,l])=>`<button type="button" class="opt-btn ${pr.cleanup===k?'on':''}" data-v="${k}">${l}</button>`).join('')}
      </div>
      ${doneCount?`<div style="margin-top:10px"><button type="button" class="ghost sm" data-cleardone>Clear ${plural(doneCount,'completed to-do')} now</button></div>`:''}
      <small style="margin-top:10px">Stickers stay in your <a href="#/stickers" data-go-stickers style="font-weight:700">sticker book</a> even after completed to-dos are cleared.</small>
    </div>
    <div class="fld"><label>Backup &amp; restore</label><small style="margin:0 0 12px">Saved in this browser. Download a copy now and then for safety.</small>
      <div class="mrow" style="margin-top:0"><button type="button" class="primary sm" data-ex>Download backup</button><button type="button" class="ghost sm" data-im>Restore</button><input type="file" accept=".json" hidden id="fi"></div></div>
    <div class="mrow"><button type="button" class="ghost danger sm" data-rs>Reset everything</button><span class="sp"></span><button type="button" class="ghost" data-x>Close</button></div></div>`;
  document.body.appendChild(ov);

  const onKey=e=>{if(e.key==='Escape')close()};
  const close=()=>{ov.remove();document.removeEventListener('keydown',onKey)};
  document.addEventListener('keydown',onKey);
  ov.onmousedown=e=>{if(e.target===ov)close()};
  ov.querySelector('[data-x]').onclick=close;
  ov.querySelector('#nm').onchange=e=>{S.name=e.target.value.trim();render()};
  const goSt=ov.querySelector('[data-go-stickers]');
  if(goSt)goSt.onclick=e=>{e.preventDefault();close();location.hash='#/stickers'};

  ov.querySelectorAll('[data-pref]').forEach(grp=>{
    const key=grp.dataset.pref;
    grp.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.onclick=()=>{
        S.prefs[key]=key==='timer'?Number(btn.dataset.v):btn.dataset.v;
        grp.querySelectorAll('.opt-btn').forEach(x=>x.classList.toggle('on',x===btn));
        render();
      };
    });
  });

  const cdBtn=ov.querySelector('[data-cleardone]');
  if(cdBtn)cdBtn.onclick=()=>{
    askConfirm(`Remove all ${plural(doneCount,'completed to-do')}?`,'Clear',()=>{
      S.tasks=S.tasks.filter(t=>t.status!=='done');
      cdBtn.remove();
      render();
      toast('Completed to-dos cleared');
    });
  };

  ov.querySelector('[data-ex]').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
    a.download='inkwell-backup-'+todayStr()+'.json';a.click();toast('Backup saved');
  };
  const fi=ov.querySelector('#fi');ov.querySelector('[data-im]').onclick=()=>fi.click();
  fi.onchange=()=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.sites||!d.tasks||!d.lib)throw 0;
        d.look={...DEFAULT_LOOK,...(d.look||{})};
        d.prefs={...DEFAULT_PREFS,...(d.prefs||{})};
        d.stickers=normalizeStickers(d.stickers);
        d.recent=Array.isArray(d.recent)?d.recent:[];
        S=d;close();location.hash='#/';syncEarnedStickers();render();toast('Restored');
      }catch(e){toast('That is not a valid Inkwell backup.')}
    };
    if(fi.files[0])r.readAsText(fi.files[0]);
  };
  ov.querySelector('[data-rs]').onclick=()=>{
    askConfirm('Wipe all sites, to-dos, and library items and start fresh?','Reset',()=>{
      S=seed();close();location.hash='#/';render();toast('Reset complete');
    });
  };
}

/* ---------- events ---------- */
function quickAdd(){
  const r=parse(),inp=document.getElementById('qa');if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  S.tasks.push({id:uid(),siteId:r[1],catId:r[2],text:v,status:'todo',due:'',url:'',libId:'',note:'',steps:[],doneAt:0});
  filter='active';refocus='#qa';render();
}
function addStep(){
  const inp=document.getElementById('stepin');if(!inp)return;const v=inp.value.trim();if(!v)return;
  const t=S.tasks.find(x=>x.id===parse()[3]);if(!t)return;
  (t.steps=t.steps||[]).push({id:uid(),text:v,done:false});refocus='#stepin';render();
}
function setDone(t,on,el){
  if(on){
    t.status='done';t.doneAt=Date.now();
    awardSticker(t);
    if(el){const r=el.getBoundingClientRect(),s=site(t.siteId);burst(r.left+r.width/2,r.top+r.height/2,s?s.color:'#ff7a9c')}
    showReward(t.sticker,t.text||'');
  }else{
    t.status='todo';t.doneAt=0;save();
  }
}
const curFolder=()=>{const r=parse();return r[0]==='lib'&&r[1]?libItem(r[1]):null};
function pushRecent(id){S.recent=[id,...(S.recent||[]).filter(x=>x!==id)].slice(0,8);save()}

let tm=null;
function stopTimer(){if(tm){clearInterval(tm.id);tm=null}const p=document.getElementById('tpill');if(p)p.remove()}
function tickTimer(){
  if(!tm)return;
  let p=document.getElementById('tpill');
  if(!p){p=document.createElement('div');p.id='tpill';p.className='tpill';document.body.appendChild(p)}
  const left=tm.end-Date.now();
  if(left<=0){clearInterval(tm.id);p.innerHTML='<span>Time is up</span><button data-tstop>Dismiss</button>';toast('Time is up');return}
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  p.innerHTML=`<span>${esc(tm.label)}</span><b>${m}:${String(s).padStart(2,'0')}</b><button data-tstop>Stop</button>`;
}
function startTimer(min,label){stopTimer();tm={end:Date.now()+min*60000,label,id:setInterval(tickTimer,1000)};tickTimer()}
document.addEventListener('click',e=>{if(e.target.closest('[data-tstop]'))stopTimer()});

app.addEventListener('click',e=>{
  const tl=e.target.closest('a[data-lib]');if(tl)pushRecent(tl.dataset.lib);
  if(!e.target.closest('[data-act="menu"]'))document.querySelectorAll('.menu').forEach(m=>m.hidden=true);
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,r=parse();
  const task=()=>S.tasks.find(t=>t.id===(el.dataset.id||r[3]));
  switch(a){
    case 'look':return openLookModal();
    case 'settings':return settings();
    case 'addsite':return siteForm();
    case 'editsite':return siteForm(site(el.dataset.id));
    case 'addlib':return libForm(null,el.dataset.t);
    case 'bulk':return bulkForm();
    case 'editlib':return libForm(libItem(el.dataset.id));
    case 'menu':{const m=el.nextElementSibling;m.hidden=!m.hidden;return}
    case 'pin':{const l=libItem(el.dataset.id);l.pin=!l.pin;toast(l.pin?'Pinned':'Unpinned');return render()}
    case 'lkind':lkind=el.dataset.v;return render();
    case 'filter':filter=el.dataset.v;return render();
    case 'qadd':return quickAdd();
    case 'steptoggle':{const t=task();if(!t)return;const x=(t.steps||[]).find(y=>y.id===el.dataset.sid);if(x)x.done=!x.done;return render()}
    case 'stepdel':{const t=task();if(!t)return;t.steps=(t.steps||[]).filter(y=>y.id!==el.dataset.sid);return render()}
    case 'timer':{const t=task();if(!t)return;startTimer(+el.dataset.v,t.text);return toast('Timer started')}
    case 'toggle':{const t=task();if(!t)return;
      const row=el.closest('.row'),on=t.status!=='done';setDone(t,on,el);
      if(on){el.classList.add('on');if(row)row.classList.add('fade');setTimeout(render,500)}else render();return}
    case 'status':{const t=task();if(!t)return;const v=el.dataset.v;
      if(v==='done'){
        if(t.status!=='done'){setDone(t,true,null);burst(e.clientX,e.clientY,(site(t.siteId)||{}).color||'#ff7a9c')}
        return render();
      }
      t.status=v;t.doneAt=0;save();return render()}
    case 'finish':{const t=task();if(!t)return;const on=t.status!=='done';setDone(t,on,el);
      if(on)setTimeout(()=>{location.hash=`#/quests/${t.siteId}/${t.catId}`},1000);else render();return}
    case 'picksticker':{const t=task();if(!t)return;return openStickerPicker(t)}
    case 'uploadsticker':return openStickerUpload();
    case 'backfill':return backfillStickers();
    case 'delcustom':{
      const c=customSticker(el.dataset.id);if(!c)return;
      askConfirm(`Remove “${c.name}” from your stickers? It will disappear from the album too.`,'Remove',()=>{
        S.stickers.custom=S.stickers.custom.filter(x=>x.id!==c.id);
        S.stickers.earned=S.stickers.earned.filter(x=>!(x.sticker&&x.sticker.kind==='custom'&&x.sticker.id===c.id));
        S.tasks.forEach(t=>{if(t.sticker&&t.sticker.kind==='custom'&&t.sticker.id===c.id){t.sticker=null;t.stickerAt=0}});
        save();render();toast('Sticker removed');
      });
      return;
    }
    case 'deltask':{
      askConfirm('Delete this to-do?','Delete',()=>{
        const t=task();S.tasks=S.tasks.filter(x=>x.id!==t.id);location.hash=`#/quests/${t.siteId}/${t.catId}`;
      });
      return;
    }
  }
});

app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='qa')quickAdd();
  if(e.key==='Enter'&&e.target.id==='stepin')addStep();
});
app.addEventListener('input',e=>{
  if(e.target.id==='libq'){q=e.target.value;document.getElementById('libres').innerHTML=libResults(curFolder())}
});
app.addEventListener('change',e=>{
  if(e.target.id==='lsort'){lsort=e.target.value;document.getElementById('libres').innerHTML=libResults(curFolder());return}
  const f=e.target.dataset.f;if(!f)return;
  const box=e.target.closest('[data-id]'),t=S.tasks.find(x=>x.id===box.dataset.id);if(!t)return;
  t[f]=e.target.value;
  if(f==='text'&&!t.text.trim())t.text='Untitled';
  if(f==='catId'){location.hash=`#/quests/${t.siteId}/${t.catId}/${t.id}`;save();return}
  save();
  if(f==='libId'||f==='url')render();
});

syncEarnedStickers();
render();
</script>
